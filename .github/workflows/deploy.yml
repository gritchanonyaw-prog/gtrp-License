name: Deploy

# Manual only. Production deploys should be protected with a GitHub Environment
# ("production") that requires reviewer approval. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gtrp/admin build
      # Migrations are additive and run before the new code. Take a D1 Time Travel bookmark first (see BACKUP_RECOVERY.md).
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.target }}
      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --env ${{ inputs.target }}
      - name: Health check
        if: ${{ vars.HEALTH_URL != '' }}
        run: curl --fail --silent --show-error "${{ vars.HEALTH_URL }}/api/v1/health"
