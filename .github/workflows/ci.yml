name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests generate throwaway secrets in vitest.config.ts; no repository secrets are used.
      - run: pnpm test
      - name: Build admin dashboard
        run: pnpm --filter @gtrp/admin build
      - name: Bundle the Worker (dry run, no deploy)
        run: pnpm --filter @gtrp/api build
      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.dev\.vars$|\.pem$|\.key$|(^|/)\.env$'; then
            echo "Secret-bearing files are tracked by git"; exit 1
          fi
          if git grep -nE '"d"\s*:\s*"[A-Za-z0-9_-]{40,}"' -- ':!pnpm-lock.yaml'; then
            echo "Something that looks like a private JWK is committed"; exit 1
          fi
